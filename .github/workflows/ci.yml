name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/public_safety_check.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  clean-install:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/smh-smoke"
          "$RUNNER_TEMP/smh-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smh-smoke/bin/smh" --help
          mkdir -p "$RUNNER_TEMP/smh-workspace"
          "$RUNNER_TEMP/smh-smoke/bin/smh" --root "$RUNNER_TEMP/smh-workspace" capabilities

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
