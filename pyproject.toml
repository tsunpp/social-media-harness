[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-harness"
version = "0.2.0"
description = "A narrative-first, privacy-aware workflow for producing and reviewing social-media media packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]
license = "Apache-2.0"
authors = [{name = "Social Media Harness contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
smh = "app.engine_cli_v2_6:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
app = ["defaults/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
